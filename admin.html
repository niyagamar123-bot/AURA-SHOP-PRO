<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>Order Admin Panel</title>
<style>body{background:#111;color:#fff;padding:20px;max-width:700px;margin:auto}h2{color:#00ff88;text-align:center}input,button{padding:12px;margin:5px;border-radius:8px;width:100%;box-sizing:border-box}button{background:#00ff88;border:none;font-weight:bold}.item{background:#222;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #00ff88}</style>
</head><body><h2>📦 Order Admin Panel</h2>
<div id="login"><input type="password" id="pass" placeholder="Password: Niyaz@@@"><button onclick="login()">Login</button></div>
<div id="panel" style="display:none">
<h3>আপনার জন্য নতুন Order</h3><div id="orders"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
const app = initializeApp({apiKey:"AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g",databaseURL:"https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"aura-premium-shop"});
const db = getDatabase(app);
function login(){ if(pass.value=='Niyaz@@@'){login.style.display='none';panel.style.display='block'}else{alert('Wrong Password')} }
window.login=login;
onValue(ref(db,'orders'),snap=>{ let html=''; snap.forEach(c=>{let o=c.val(); if(o.status=='New') html+=`<div class="item"><b>Order ID:</b> ${o.orderId}<br><b>Product:</b> ${o.order}<br><b>Time:</b> ${o.date}<br><b>Assigned:</b> ${o.assignedTo || 'Waiting'}</div>`}); orders.innerHTML=html || 'এখনো কোনো Order নাই'});
</script></body></html>
