<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Admin</title>
<style>
body{background:#000;color:#fff;font-family:'Hind Siliguri',sans-serif;padding:20px}
.box{background:#111;padding:20px;border-radius:10px;max-width:900px;margin:auto}
input,textarea,button{width:100%;padding:10px;margin:8px 0;background:#222;border:1px solid #00ffff;color:#fff;border-radius:5px}
button{background:#00ffff;color:#000;font-weight:bold;cursor:pointer}
#panel{display:none}
.item{background:#222;padding:10px;margin:8px 0;border-radius:5px;display:flex;justify-content:space-between}
.del{background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}
.tabs button{background:#333;color:#fff;margin-right:5px}
.tabs .active{background:#00ffff;color:#000}
</style>
</head>
<body>
<div class="box" id="login">
  <h2>👑 Main Admin Login</h2>
  <input type="password" id="pass" placeholder="Password: niyaz@@@">
  <button onclick="login()">Login</button>
</div>

<div class="box" id="panel">
  <h2>👑 Main Admin Panel</h2>
  <div class="tabs">
    <button class="active" onclick="showTab('product')">প্রোডাক্ট</button>
    <button onclick="showTab('orderAdmin')">Order Admin</button>
    <button onclick="showTab('supportAdmin')">Support Admin</button>
  </div>
  
  <div id="productTab">
    <h3>➕ প্রোডাক্ট Add করুন</h3>
    <input id="pName" placeholder="প্রোডাক্টের নাম">
    <input id="pPrice" placeholder="দাম: 50 টাকা">
    <input id="pImg" placeholder="ছবির URL">
    <textarea id="pDesc" placeholder="Description"></textarea>
    <button onclick="addProduct()">Add করুন</button>
    <h3>📦 প্রোডাক্ট লিস্ট</h3><div id="pList"></div>
  </div>
  
  <div id="orderAdminTab" style="display:none">
    <h3>➕ Order Admin Add করুন - Password: niyaz</h3>
    <input id="oName" placeholder="Admin নাম">
    <button onclick="addOrderAdmin()">Add করুন</button>
    <div id="oList"></div>
  </div>
  
  <div id="supportAdminTab" style="display:none">
    <h3>➕ Support Admin Add করুন - Password: niyZ@@</h3>
    <input id="sName" placeholder="Admin নাম">
    <button onclick="addSupportAdmin()">Add করুন</button>
    <div id="sList"></div>
  </div>
</div>

<script>
function login(){
  if(document.getElementById('pass').value=="niyaz@@@"){
    document.getElementById('login').style.display='none';
    document.getElementById('panel').style.display='block';
    loadAll();
  }else alert("ভুল পাসওয়ার্ড")
}
function showTab(tab){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  ['productTab','orderAdminTab','supportAdminTab'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById(tab+'Tab').style.display='block';
}

function addProduct(){
  let p={name:pName.value,price:pPrice.value,img:pImg.value,desc:pDesc.value};
  let arr=JSON.parse(localStorage.getItem('products'))||[]; arr.push(p);
  localStorage.setItem('products',JSON.stringify(arr)); loadProducts();
}
function deleteProduct(i){let arr=JSON.parse(localStorage.getItem('products'))||[]; arr.splice(i,1); localStorage.setItem('products',JSON.stringify(arr)); loadProducts();}
function loadProducts(){let arr=JSON.parse(localStorage.getItem('products'))||[]; pList.innerHTML=arr.map((p,i)=>`<div class="item"><span>${p.name} - ${p.price}</span><button class="del" onclick="deleteProduct(${i})">Delete</button></div>`).join('')}

function addOrderAdmin(){let arr=JSON.parse(localStorage.getItem('orderAdmins'))||[]; arr.push(oName.value); localStorage.setItem('orderAdmins',JSON.stringify(arr)); oName.value=''; loadOrderAdmins();}
function loadOrderAdmins(){let arr=JSON.parse(localStorage.getItem('orderAdmins'))||[]; oList.innerHTML=arr.map((n,i)=>`<div class="item"><span>${n} - Pass: niyaz</span></div>`).join('')}

function addSupportAdmin(){let arr=JSON.parse(localStorage.getItem('supportAdmins'))||[]; arr.push(sName.value); localStorage.setItem('supportAdmins',JSON.stringify(arr)); sName.value=''; loadSupportAdmins();}
function loadSupportAdmins(){let arr=JSON.parse(localStorage.getItem('supportAdmins'))||[]; sList.innerHTML=arr.map((n,i)=>`<div class="item"><span>${n} - Pass: niyZ@@</span></div>`).join('')}

function loadAll(){loadProducts(); loadOrderAdmins(); loadSupportAdmins();}
</script>
</body>
</html>
