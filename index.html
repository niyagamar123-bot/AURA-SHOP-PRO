<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niyazgamar Shop</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;padding:20px;max-width:700px;margin:auto}
h1,h3{color:#00ff88;text-align:center}
.product-card{background:#222;padding:15px;margin:15px 0;border-radius:12px;border:2px solid #00ff88}
.product-card img{width:100%;border-radius:8px}
.price{color:#00ff88;font-size:20px;font-weight:bold}
button{background:#00ff88;color:#000;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;margin-top:10px}
select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #00ff88;background:#222;color:#fff;font-size:16px}
.order-form{background:#1a1a1a;padding:15px;border-radius:10px;margin-top:10px;display:none}
.nav-btn{background:#333;color:#00ff88;margin:5px 0}
</style>
</head>
<body>
<h1>🔥 Niyazgamar Shop 🔥</h1>
<button class="nav-btn" onclick="window.location='support.html'">📞 Live Customer Support</button>
<button class="nav-btn" onclick="window.location='mainadmin.html'">👑 Main Admin</button>
<button class="nav-btn" onclick="window.location='admin.html'">📦 Order Admin</button>
<div id="products">Loading...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";
  const firebaseConfig = {apiKey:"AIzaSyAeL4HVPaea7ZCfI3jg1HFcJlv1nxnOm8g",authDomain:"aura-premium-shop.firebaseapp.com",databaseURL:"https://aura-premium-shop-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"aura-premium-shop"};
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let allProducts = [];

  onValue(ref(db, 'products'), (snapshot) => {
    allProducts = []; snapshot.forEach((child) => { let p = child.val(); p.id = child.key; allProducts.push(p); });
    let html='';
    allProducts.forEach(p => {
      html += `<div class="product-card">
        <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x200'">
        <h3>${p.name}</h3><p>${p.desc}</p><p class="price">${p.price} TK</p>
        <button onclick="showOrderForm('${p.id}')">Order Now</button>
        <div class="order-form" id="form-${p.id}">
          <h4>Order Confirm করুন</h4>
          <select id="product-${p.id}">${allProducts.map(prod => `<option>${prod.name} - ${prod.price} TK</option>`).join('')}</select>
          <button onclick="placeOrder()">Order করুন</button>
        </div>
      </div>`;
    });
    document.getElementById('products').innerHTML = html || 'কোনো Product নাই। Main Admin Add করবে';
  });

  window.showOrderForm = function(id) { document.getElementById('form-'+id).style.display = 'block'; }
  window.placeOrder = function() {
    let selectedProduct = document.querySelector('.order-form select').value;
    let orderId = 'ORD' + Date.now();
    push(ref(db, 'orders'), {orderId: orderId, order: selectedProduct, status: 'New', date: new Date().toLocaleString('bn-BD'), assignedTo: ''});
    alert('✅ Order Successful! Order ID: ' + orderId + ' \nAdmin 5 মিনিটের মধ্যে যোগাযোগ করবে');
  }
</script>
</body>
</html>
