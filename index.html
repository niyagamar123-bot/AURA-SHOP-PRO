<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA SHOP PRO</title>
<style>
body{font-family:'Hind Siliguri',sans-serif;background:#0f0f0f;color:#fff;margin:0;padding:0}
header{background:linear-gradient(90deg,#ff00ff,#00ffff);padding:20px;text-align:center}
.top-btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
.top-btns a{background:#000;color:#00ffff;padding:10px 18px;border-radius:5px;text-decoration:none;border:1px solid #00ffff;font-weight:bold}
.container{max-width:1000px;margin:20px auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.product{background:#1a1a1a;padding:15px;border-radius:10px;border:1px solid #333}
.product img{width:100%;height:180px;object-fit:cover;border-radius:8px}
.btn{display:block;background:#00ffff;color:#000;padding:12px;text-align:center;border-radius:5px;text-decoration:none;font-weight:bold;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🔥 AURA SHOP PRO 🔥</h1>
  <div class="top-btns">
    <a href="https://wa.me/8801908807313" target="_blank">💬 Customer Service</a>
    <a href="admin.html">👑 Main Admin</a>
  </div>
</header>
<div class="container" id="productContainer"></div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [
  {name:"Hotmail Old Mail 2020", price:"50 টাকা", img:"https://i.ibb.co/xyz.jpg", desc:"✅ 100% ফ্রেশ | ✅ ইনবক্স আছে"}
];
let html = '';
products.forEach(p=>{
  html += `<div class="product">
    <img src="${p.img}" onerror="this.src='https://via.placeholder.com/300x180'">
    <h3>${p.name}</h3>
    <p>${p.desc}</p>
    <p><b>দাম: ${p.price}</b></p>
    <a href="order.html?product=${encodeURIComponent(p.name + ' - ' + p.price)}" class="btn">Order Now</a>
  </div>`;
});
document.getElementById('productContainer').innerHTML = html || "<p>এখনো কোনো প্রোডাক্ট Add হয়নি</p>";
</script>
</body>
</html>
